# Low-cost CI policy:
# - NO automatic runs on ordinary branch/main pushes or PR synchronize.
# - Full checks only when a draft PR becomes ready for review, on manual dispatch,
#   or when a version tag is pushed.
# - A manually dispatched run may not satisfy GitHub PR required status checks.
name: quality-gates

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-static-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q backend scripts
      - run: python scripts/neshan_smoke.py  # must remain offline by default
      - run: python scripts/neshan_smoke.py --service direction  # still zero paid calls
      - run: python scripts/verify_scaffold.py
      - run: python scripts/verify_blueprint.py
      - run: python -m unittest discover -s tests -p "test_contracts.py" -v
      - run: python -m unittest discover -s scripts -p "test_predeploy_smoke.py" -v
      - run: python -m unittest discover -s scripts -p "test_retrieval_benchmark.py" -v
      - run: python -m unittest discover -s scripts -p "test_check_release_evidence.py" -v

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bazaar_compass_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bazaar_compass_test
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-temporary-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check .

  production-compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DJANGO_SECRET_KEY: ci-nonsecret-synthetic-check-not-for-production
      DJANGO_ALLOWED_HOSTS: example.invalid
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.invalid
      POSTGRES_PASSWORD: ci-disposable-postgres-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration without credentials
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bazaar_compass_browser
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bazaar_compass_browser
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-synthetic-browser-fixture-secret
      LLM_ENABLED: '0'
      DEMO_CONTACT_OUTCOMES: no_answer,confirmed_available
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Prepare synthetic catalog and run local services
        run: |
          python backend/manage.py migrate --noinput
          python scripts/seed_browser_fixture.py
          (cd backend; nohup python manage.py runserver 127.0.0.1:8000 > /tmp/bazaar-browser-backend.log 2>&1 &)
          (cd frontend; nohup npm run dev -- --host 127.0.0.1 > /tmp/bazaar-browser-frontend.log 2>&1 &)
      - name: Execute browser purchase and RTL regression
        run: python scripts/browser_journey.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-browser-journey
          path: browser-artifacts/
          if-no-files-found: ignore
      - name: Service logs if unsuccessful
        if: failure()
        run: |
          tail -n 120 /tmp/bazaar-browser-backend.log || true
          tail -n 120 /tmp/bazaar-browser-frontend.log || true
