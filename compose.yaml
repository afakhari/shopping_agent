name: bazaar-compass
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazaar_compass}
      POSTGRES_USER: ${POSTGRES_USER:-bazaar_compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-insecure-key-change-before-deploy}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend
      DATABASE_URL: postgresql://${POSTGRES_USER:-bazaar_compass}:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/${POSTGRES_DB:-bazaar_compass}
      DATASET_RAW_DIR: /app/data/raw
      DATASET_REPORT_DIR: /app/reports
      LLM_ENABLED: ${LLM_ENABLED:-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-6}
      DEMO_CONTACT_OUTCOMES: ${DEMO_CONTACT_OUTCOMES:-no_answer,confirmed_available,unavailable,closed,error}
      NESHAN_ROUTING_ENABLED: ${NESHAN_ROUTING_ENABLED:-0}
      NESHAN_ROUTING_API_KEY: ${NESHAN_ROUTING_API_KEY:-}
      NESHAN_ROUTING_MAX_CALLS_PER_MISSION: ${NESHAN_ROUTING_MAX_CALLS_PER_MISSION:-0}
      NESHAN_ROUTING_DAILY_MAX_CALLS: ${NESHAN_ROUTING_DAILY_MAX_CALLS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30 --access-logfile -"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
